
data:
  metadata: data/sabdab/sabdab/metadata.json
  pdb_dir: data/sabdab/pdb
  samples_dir: data/sabdab/sabdab/samples
  train_ids: data/sabdab/sabdab_file/split_debug_one/val_prot_ids.txt
  val_ids: data/sabdab/sabdab_file/split_debug_one/val_prot_ids.txt
  test_ids: data/sabdab/sabdab_file/split_debug_one/val_prot_ids.txt
  train_clusters: data/sabdab/sabdab_file/split_debug_one/train_prot_cluster.txt
  batch_size: 1
  num_workers: 2
  n_steps: 200
  forward_chunk_size: 256
  max_antigen_len: 256  # 384

model:
  ppi_ckpt: "/root/private_data/luog/codex/IgGM/checkpoints/esm_ppi_650m_ab.pth"
  # design_ckpt: "/root/private_data/luog/codex/IgGM2/outputs/Iggm_lightning_training_all_0720/checkpoints/best-epoch=1999-val_tm_score=0.0000.ckpt"
  design_ckpt: ""

diffusion:
  rota_angle_rms_min: 0.005
  rota_schedule_gamma: 1.5


optimizer:
  lr: 2.0e-4
  weight_decay: 0.0 # 1.0e-3
  grad_clip: 1.0
  ema_decay: 0.99

scheduler:
  name: common_lr

metrics:
  dockq_threshold: 0.23

eval:
  precise_eval_every_n_val: 2
  precise_eval_steps: 5
  precise_eval_seed: 20260909

trainer:
  max_epochs: 2000
  precision: bf16 # bf16-mixed
  accelerator: gpu
  devices: [0] 
  log_every_n_steps: 10
  accumulate_grad_batches: 2
  num_sanity_val_steps: 1
  strategy: ddp
  ddp_static_graph: false
  ddp_find_unused_parameters: true

wandb:
  disabled: true # true or false
  project: IgGM
  run_name: Iggm_lightning_training_nono
  entity: "mllm-csu"
  api_key: "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"

runtime:
  output_dir: outputs/Iggm_lightning_training_nono
  seed: 56
  resume: false
  run_test: true

stage_training:
  stage1_epochs: 0
  stage2_enable_seq_recovery: true
  mix_cdr_h3: 4
  mix_cdr_h1: 2
  mix_cdr_h2: 2
  mix_cdr_all: 2
  lazy_cache_size: 128
  occupancy_mode: joint_predict

