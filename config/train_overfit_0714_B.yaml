
data:
  metadata: data/sabdab/sabdab/metadata.json
  pdb_dir: data/sabdab/pdb
  samples_dir: data/sabdab/sabdab/samples
  train_ids: data/sabdab/sabdab_file/split_debug_one/train_prot_ids.txt
  val_ids: data/sabdab/sabdab_file/split_debug_one/val_prot_ids.txt
  test_ids: data/sabdab/sabdab_file/split_debug_one/test_prot_ids.txt
  train_clusters: data/sabdab/sabdab_file/split_debug_one/train_prot_cluster.txt
  batch_size: 1
  num_workers: 2
  n_steps: 200
  forward_chunk_size: 256
  max_antigen_len: 256  # 384

model:
  ppi_ckpt: "/root/private_data/luog/codex/IgGM/checkpoints/esm_ppi_650m_ab.pth"
  # design_ckpt: "/root/private_data/luog/codex/IgGM2/outputs/Iggm_lightning_training_debug_one0708/checkpoints/last.ckpt"
  design_ckpt: ""
  igso3_buffer: "/root/private_data/luog/codex/IgGM/checkpoints/igso3_buffer.pth" 

optimizer:
  lr: 1.0e-4
  weight_decay: 0.0 # 1.0e-3
  grad_clip: 1.0

# scheduler:
#   name: cosine
#   t_max: 2000
#   eta_min: 1.0e-5
#   warmup_steps: 20
scheduler:
  name: common_lr

metrics:
  dockq_threshold: 0.23

trainer:
  max_epochs: 1500
  precision: bf16 # bf16-mixed
  accelerator: gpu
  devices: [0] 
  log_every_n_steps: 10
  accumulate_grad_batches: 2
  num_sanity_val_steps: 1
  strategy: ddp
  ddp_static_graph: false
  ddp_find_unused_parameters: true

wandb:
  disabled: false # true or false
  project: IgGM
  run_name: Iggm_lightning_training_B_Centered_force_torque
  entity: "mllm-csu"
  api_key: "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"

runtime:
  output_dir: outputs/Iggm_lightning_training_B_Centered_force_torque
  seed: 56
  resume: false
  run_test: true

stage_training:
  stage1_epochs: 0
  stage2_enable_seq_recovery: true
  mix_cdr_h3: 4
  mix_cdr_h1: 2
  mix_cdr_h2: 2
  mix_cdr_all: 2
  lazy_cache_size: 128
  occupancy_mode: joint_predict

