
data:
  metadata: data/sabdab/sabdab/metadata.json
  pdb_dir: data/sabdab/pdb
  samples_dir: data/sabdab/sabdab/samples
  train_ids: data/sabdab/sabdab_file/split_debug_one/train_prot_ids.txt
  val_ids: data/sabdab/sabdab_file/split_debug_one/val_prot_ids.txt
  test_ids: data/sabdab/sabdab_file/split_debug_one/test_prot_ids.txt
  train_clusters: data/sabdab/sabdab_file/split_debug_one/train_prot_cluster.txt
  batch_size: 1
  num_workers: 2
  n_steps: 200
  forward_chunk_size: 256
  max_antigen_len: 256  # 384

model:
  ppi_ckpt: "/root/private_data/luog/codex/IgGM/checkpoints/esm_ppi_650m_ab.pth"
  design_ckpt: ""

diffusion:
  rota_angle_rms_min: 0.005
  rota_schedule_gamma: 1.5

optimizer:
  lr: 2.0e-4
  weight_decay: 0.0 # 1.0e-3
  grad_clip: 1.0
  # Validation runs on the EMA weights; training gradients are untouched.
  # Comment out to disable EMA entirely.
  # 0.99 ~= a 100-step averaging window, matched to the current 1k-4k-step
  # diagnostic runs.  0.999 (~1000 steps) would mix in most of the run's early
  # weights and make the EMA curve lag the real progress.  Raise it back to
  # 0.999 for the long S4+ trainings.
  ema_decay: 0.99

# scheduler:
#   name: cosine
#   t_max: 2000
#   eta_min: 1.0e-5
#   warmup_steps: 20
scheduler:
  name: common_lr

metrics:
  dockq_threshold: 0.23

eval:
  # Precise layer: full reverse sampling + StructureMetrics, reported as means
  # under val/precise_*.  Cadence counts VALIDATION RUNS, not epochs.
  # With max_epochs 2000 and check_val_every_n_epoch 50 there are 40 val runs,
  # so 10 gives 4 precise evaluations over the run.
  # 0 disables the layer entirely (and then no precise checkpoint is created).
  precise_eval_every_n_val: 10
  # Network evaluations: t=200,180,...,20; t=0 is only the terminal sentinel.
  precise_eval_steps: 10
  # Pins the whole trajectory (noise + rotations) so checkpoints are comparable.
  precise_eval_seed: 20260909
  # Fixed per-(sample,timestep) Cheap noise, split into independent channels.
  cheap_eval_seed: 20260915

trainer:
  max_epochs: 2000 # 2000
  check_val_every_n_epoch: 50
  precision: bf16 # bf16-mixed
  accelerator: gpu
  devices: [0] 
  log_every_n_steps: 10
  accumulate_grad_batches: 2
  num_sanity_val_steps: 1
  strategy: ddp
  ddp_static_graph: false
  ddp_find_unused_parameters: true

wandb:
  disabled: false # true or false
  project: IgGM
  run_name: Iggm_lightning_training_all_0908
  entity: "mllm-csu"
  api_key: "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"

runtime:
  output_dir: outputs/Iggm_lightning_training_all_0908
  seed: 56
  resume: false
  run_test: true

stage_training:
  stage1_epochs: 0
  stage2_enable_seq_recovery: true
  mix_cdr_h3: 4
  mix_cdr_h1: 2
  mix_cdr_h2: 2
  mix_cdr_all: 2
  lazy_cache_size: 128
  occupancy_mode: joint_predict
